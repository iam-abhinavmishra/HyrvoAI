spring.application.name=hyrvoai

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/hyrvoai}
spring.datasource.username=${DB_USERNAME:hyrvoai}
spring.datasource.password=${DB_PASSWORD:hyrvoai_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:llama3.2}
spring.ai.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

spring.ai.vectorstore.pgvector.initialize-schema=true

jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-a-long-random-value}